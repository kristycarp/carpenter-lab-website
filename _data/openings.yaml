# open positions, listed on the Join Us page in this order
# role: one of the member roles in types.yaml (sets the icon)
# link: url of the posted job description (leave out to hide the button)

- title: Postdoctoral Researcher
  role: postdoc
  description: Scientists with an MD or a PhD (or nearing completion of one) who have a strong background in either 1) machine learning at the molecular/structural level for drug discovery-related applications; or 2) substance use disorder research (machine learning background preferred but not required) may contact Dr. Carpenter directly via email. Please use the subject line `Postdoc Application - Carpenter Lab`. Include your CV and a cover letter.
  link:

- title: PhD Rotation Student
  role: phd
  description: Current first-year PhD students at CU Anschutz who are in Computational Bioscience, Biomedical Sciences, Human Medical Genetics and Genomics, Pharmaceutical Sciences, or another program related to the lab's research, and who would like to rotate in the lab, should reach out to Dr. Carpenter directly via email.
  link:

- title: MS Student
  role: ms
  description: Current MS students at the University of Colorado Anschutz, University of Colorado Denver, or University of Colorado Boulder should apply via Handshake (Posting \#11702418). Strong background in machine learning and data science is preferred.
  link: 

- title: Research Staff
  role: staff
  description: Scientists with a BS or MS who are interested in a full-time staff position at the entry/intermediate level should apply via [CU Careers](https://cu.taleo.net/careersection/2/jobdetail.ftl?job=41730). Strong background in machine learning and data science is preferred.
  link:

- title: Undergraduate Researcher
  role: undergrad
  description: Current juniors and seniors at the University of Colorado Denver or University of Colorado Boulder with experience in machine learning (i.e. previous research, internship, or class project) should apply via Handshake (Posting \#11920318).
  link:
