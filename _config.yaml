# site properties and page defaults
title: Carpenter Lab
subtitle: University of Colorado Anschutz
description: Homepage of the Carpenter Lab at CU Anschutz
proofer: false

# site social media and other links
links:
  email: kristy.carpenter@cuanschutz.edu
  orcid: 0000-0003-4570-5170
  google-scholar: vA3YaaQAAAAJ
  github: kristycarp
  # twitter: kristycarp
  # youtube: kristycarp

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post
      # blog hidden for now; delete these two lines to publish posts again
      published: false

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
